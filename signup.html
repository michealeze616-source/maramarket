<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - MaraMarket</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0d6efd, #4f46e5, #7c3aed);
      padding: 25px 15px;
      color: #172033;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: 20px auto;
      background: rgba(255,255,255,0.97);
      border-radius: 28px;
      padding: 32px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.2);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      color: #1769ff;
      font-size: 32px;
      margin-bottom: 5px;
    }

    .logo p {
      color: #667085;
      font-size: 14px;
    }

    h2 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #667085;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .section-title {
      font-size: 15px;
      font-weight: bold;
      margin: 22px 0 12px;
      color: #1769ff;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d8dee9;
      border-radius: 13px;
      outline: none;
      font-size: 15px;
      background: white;
    }

    input:focus {
      border-color: #1769ff;
      box-shadow: 0 0 0 3px rgba(23,105,255,0.1);
    }

    .required {
      color: #e11d48;
    }

    .optional {
      color: #98a2b3;
      font-weight: normal;
    }

    .hint {
      font-size: 12px;
      color: #667085;
      margin-top: 5px;
    }

    .button {
      width: 100%;
      border: 0;
      padding: 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1769ff, #4f46e5);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .button:disabled {
      opacity: 0.6;
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 12px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fff1f2;
      color: #be123c;
      border: 1px solid #fecdd3;
    }

    .message.success {
      display: block;
      background: #ecfdf3;
      color: #027a48;
      border: 1px solid #abefc6;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #667085;
    }

    .login a {
      color: #1769ff;
      font-weight: bold;
      text-decoration: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #667085;
      text-decoration: none;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 24px 18px;
        margin-top: 5px;
      }

      .row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .logo h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <h1>MaraMarket</h1>
    <p>Buy. Sell. Connect.</p>
  </div>

  <h2>Create your account</h2>

  <p class="subtitle">
    Join MaraMarket and start buying or selling today.
  </p>

  <div id="message" class="message"></div>

  <!-- No normal form submission -->
  <div id="signupForm">

    <div class="section-title">Personal Information</div>

    <div class="row">

      <div class="field">
        <label>
          Full Name <span class="required">*</span>
        </label>

        <input
          type="text"
          id="fullName"
          placeholder="Your full name"
        >
      </div>

      <div class="field">
        <label>
          Username <span class="required">*</span>
        </label>

        <input
          type="text"
          id="username"
          placeholder="e.g. mike123"
        >

        <div class="hint">
          Letters, numbers and underscores only.
        </div>
      </div>

    </div>

    <div class="field">
      <label>
        Email <span class="required">*</span>
      </label>

      <input
        type="email"
        id="email"
        placeholder="you@example.com"
      >
    </div>

    <div class="row">

      <div class="field">
        <label>
          Phone <span class="optional">(optional)</span>
        </label>

        <input
          type="tel"
          id="phone"
          placeholder="08012345678"
        >
      </div>

      <div class="field">
        <label>
          WhatsApp <span class="required">*</span>
        </label>

        <input
          type="tel"
          id="whatsapp"
          placeholder="08012345678"
        >
      </div>

    </div>

    <div class="section-title">Location</div>

    <div class="row">

      <div class="field">
        <label>
          State <span class="required">*</span>
        </label>

        <input
          type="text"
          id="state"
          placeholder="e.g. Lagos"
        >
      </div>

      <div class="field">
        <label>
          City <span class="required">*</span>
        </label>

        <input
          type="text"
          id="city"
          placeholder="e.g. Ikeja"
        >
      </div>

    </div>

    <div class="field">
      <label>
        Area <span class="optional">(optional)</span>
      </label>

      <input
        type="text"
        id="area"
        placeholder="e.g. Allen Avenue"
      >
    </div>

    <div class="section-title">
      Social Media <span class="optional">(optional)</span>
    </div>

    <div class="row">

      <div class="field">
        <label>Instagram</label>

        <input
          type="text"
          id="instagram"
          placeholder="@username"
        >
      </div>

      <div class="field">
        <label>Telegram</label>

        <input
          type="text"
          id="telegram"
          placeholder="@username"
        >
      </div>

    </div>

    <div class="field">
      <label>TikTok</label>

      <input
        type="text"
        id="tiktok"
        placeholder="@username"
      >
    </div>

    <div class="section-title">Security</div>

    <div class="field">
      <label>
        Password <span class="required">*</span>
      </label>

      <input
        type="password"
        id="password"
        placeholder="At least 6 characters"
      >
    </div>

    <div class="field">
      <label>
        Confirm Password <span class="required">*</span>
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Enter password again"
      >
    </div>

    <button
      type="button"
      class="button"
      id="signupButton"
    >
      Create Account
    </button>

  </div>

  <div class="login">
    Already have an account?
    <a href="login.html">Log in</a>
  </div>

  <a href="index.html" class="back">
    ← Back to MaraMarket
  </a>

</div>

<script>

  const SUPABASE_URL =
    "https://hakjsjmexinuiwhxejva.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_OjO3jp9ZlV0N2WHHBddN8g_rryvMoAL";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

  const button =
    document.getElementById("signupButton");

  const message =
    document.getElementById("message");


  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

  }


  function getValue(id) {

    return document
      .getElementById(id)
      .value
      .trim();

  }


  button.addEventListener("click", async function() {

    // Stop any page movement
    window.scrollTo({
      top: window.scrollY,
      behavior: "instant"
    });

    message.className = "message";
    message.textContent = "";

    const fullName = getValue("fullName");
    const username = getValue("username").toLowerCase();
    const email = getValue("email");
    const phone = getValue("phone");
    const whatsapp = getValue("whatsapp");
    const state = getValue("state");
    const city = getValue("city");
    const area = getValue("area");
    const instagram = getValue("instagram");
    const telegram = getValue("telegram");
    const tiktok = getValue("tiktok");

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;


    if (
      !fullName ||
      !username ||
      !email ||
      !whatsapp ||
      !state ||
      !city ||
      !password ||
      !confirmPassword
    ) {

      showMessage(
        "Please fill in all required fields.",
        "error"
      );

      return;
    }


    if (!/^[a-z0-9_]+$/.test(username)) {

      showMessage(
        "Username can only contain letters, numbers and underscores.",
        "error"
      );

      return;
    }


    if (username.length < 3) {

      showMessage(
        "Username must contain at least 3 characters.",
        "error"
      );

      return;
    }


    if (password.length < 6) {

      showMessage(
        "Password must contain at least 6 characters.",
        "error"
      );

      return;
    }


    if (password !== confirmPassword) {

      showMessage(
        "Passwords do not match.",
        "error"
      );

      return;
    }


    button.disabled = true;
    button.textContent = "Creating account...";


    try {

      const result =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            data: {

              full_name: fullName,
              username: username,
              phone: phone,
              whatsapp: whatsapp,
              state: state,
              city: city,
              area: area,
              instagram: instagram,
              telegram: telegram,
              tiktok: tiktok

            }

          }

        });


      if (result.error) {

        throw result.error;

      }


      if (result.data.session) {

        showMessage(
          "Account created successfully! Redirecting...",
          "success"
        );

        setTimeout(function() {

          window.location.href =
            "index.html";

        }, 1500);

      } else {

        showMessage(
          "Account created! Please check your email to confirm your account, then log in.",
          "success"
        );

        button.textContent =
          "Account Created";

      }

    } catch (error) {

      console.error(error);

      showMessage(
        error.message ||
        "Unable to create account. Please try again.",
        "error"
      );

      button.disabled = false;
      button.textContent =
        "Create Account";

    }

  });

</script>

</body>
</html>
