<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sell on MaraMarket</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #172033;
}

header {
    background: #0d6efd;
    color: white;
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.back {
    color: white;
    text-decoration: none;
}

.container {
    max-width: 850px;
    margin: 30px auto;
    padding: 0 16px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

h1 {
    margin-bottom: 8px;
}

.subtitle {
    color: #687386;
    margin-bottom: 25px;
}

.step {
    display: none;
}

.step.active {
    display: block;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: bold;
}

input,
textarea,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #d7dce5;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
}

textarea {
    min-height: 130px;
    resize: vertical;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #0d6efd;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 20px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.next {
    background: #0d6efd;
    color: white;
    flex: 1;
}

.backBtn {
    background: #e9edf3;
    color: #172033;
}

.save {
    background: #198754;
    color: white;
    flex: 1;
}

.progress {
    display: flex;
    gap: 7px;
    margin-bottom: 25px;
}

.progress div {
    height: 5px;
    flex: 1;
    background: #dfe4ec;
    border-radius: 10px;
}

.progress div.active {
    background: #0d6efd;
}

.photo-box {
    border: 2px dashed #b9c3d2;
    border-radius: 15px;
    padding: 35px 20px;
    text-align: center;
    cursor: pointer;
}

.photo-box input {
    display: none;
}

.photo-preview {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 15px;
}

.photo-preview img {
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 10px;
}

.summary {
    background: #f5f7fa;
    border-radius: 12px;
    padding: 18px;
    line-height: 1.8;
}

.success {
    text-align: center;
    display: none;
}

.success h2 {
    color: #198754;
    margin-bottom: 10px;
}

.error {
    background: #ffe8e8;
    color: #b42318;
    padding: 12px;
    border-radius: 10px;
    margin-top: 15px;
    display: none;
}

@media(max-width:600px) {
    .card {
        padding: 18px;
    }

    header {
        padding: 15px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">MaraMarket</div>
    <a href="index.html" class="back">← Home</a>
</header>

<div class="container">

<div class="card">

<h1>Sell on MaraMarket</h1>
<p class="subtitle">Create a listing and reach buyers across Nigeria.</p>

<div class="progress">
    <div id="p1" class="active"></div>
    <div id="p2"></div>
    <div id="p3"></div>
    <div id="p4"></div>
</div>

<!-- STEP 1 -->
<div class="step active" id="step1">

    <h2>1. Photos</h2>

    <label class="photo-box">
        <input type="file" id="photos" accept="image/*" multiple>
        <strong>📷 Add photos</strong>
        <br>
        <small>You can select up to 10 photos.</small>
    </label>

    <div class="photo-preview" id="photoPreview"></div>

    <div class="buttons">
        <button class="next" onclick="nextStep(2)">
            Continue →
        </button>
    </div>

</div>

<!-- STEP 2 -->
<div class="step" id="step2">

    <h2>2. Item Details</h2>

    <label>Item title *</label>
    <input id="title" type="text" placeholder="e.g. iPhone 15 Pro Max">

    <label>Category *</label>
    <select id="category">
        <option value="">Select category</option>
        <option>Phones</option>
        <option>Electronics</option>
        <option>Fashion</option>
        <option>Vehicles</option>
        <option>Property</option>
        <option>Gaming</option>
        <option>Beauty</option>
        <option>Home & Garden</option>
        <option>Sports</option>
        <option>Services</option>
        <option>Other</option>
    </select>

    <label>Condition *</label>
    <select id="condition">
        <option value="">Select condition</option>
        <option>Brand New</option>
        <option>Like New</option>
        <option>Used</option>
        <option>Fairly Used</option>
        <option>Refurbished</option>
    </select>

    <label>Brand</label>
    <input id="brand" type="text" placeholder="e.g. Apple">

    <label>Model</label>
    <input id="model" type="text" placeholder="e.g. iPhone 15 Pro Max">

    <label>Price (₦) *</label>
    <input id="price" type="number" min="0" placeholder="e.g. 850000">

    <label>Description *</label>
    <textarea id="description"
        placeholder="Describe your item, including important details buyers should know."></textarea>

    <div class="buttons">
        <button class="backBtn" onclick="nextStep(1)">← Back</button>
        <button class="next" onclick="nextStep(3)">Continue →</button>
    </div>

</div>

<!-- STEP 3 -->
<div class="step" id="step3">

    <h2>3. Location & Contact</h2>

    <label>State *</label>
    <input id="state" type="text" placeholder="e.g. Lagos">

    <label>City *</label>
    <input id="city" type="text" placeholder="e.g. Ikeja">

    <label>Area</label>
    <input id="area" type="text" placeholder="e.g. Allen Avenue">

    <label>WhatsApp *</label>
    <input id="whatsapp" type="text" placeholder="e.g. 08012345678">

    <label>Phone</label>
    <input id="phone" type="text" placeholder="e.g. 08012345678">

    <label>Instagram</label>
    <input id="instagram" type="text" placeholder="@username">

    <label>Telegram</label>
    <input id="telegram" type="text" placeholder="@username">

    <label>TikTok</label>
    <input id="tiktok" type="text" placeholder="@username">

    <div class="buttons">
        <button class="backBtn" onclick="nextStep(2)">← Back</button>
        <button class="next" onclick="preparePreview()">Continue →</button>
    </div>

</div>

<!-- STEP 4 -->
<div class="step" id="step4">

    <h2>4. Preview</h2>

    <div class="summary" id="summary"></div>

    <div id="errorBox" class="error"></div>

    <div class="buttons">
        <button class="backBtn" onclick="nextStep(3)">← Edit</button>
        <button class="save" id="saveButton" onclick="saveListing()">
            Continue to Payment →
        </button>
    </div>

</div>

<!-- SUCCESS -->
<div class="success" id="successBox">

    <h2>✓ Listing Saved!</h2>

    <p>
        Your listing has been submitted successfully and is currently
        waiting for payment verification.
    </p>

    <br>

    <button class="next" onclick="window.location.href='account.html'">
        Go to My Account
    </button>

</div>

</div>
</div>

<script>

const SUPABASE_URL =
    "https://hakjsjmexinuiwhxejva.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_OjO3jp9ZlV0N2WHHBddN8g_rryvMoAL";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

let currentUser = null;
let selectedPhotos = [];


/* CHECK LOGIN */
async function checkLogin() {

    const { data, error } =
        await supabaseClient.auth.getSession();

    if (error || !data.session) {
        window.location.href = "login.html";
        return;
    }

    currentUser = data.session.user;
}


/* PHOTOS */
document.getElementById("photos").addEventListener("change", function(e) {

    selectedPhotos =
        Array.from(e.target.files).slice(0, 10);

    const preview =
        document.getElementById("photoPreview");

    preview.innerHTML = "";

    selectedPhotos.forEach(file => {

        const reader = new FileReader();

        reader.onload = function(event) {

            const img =
                document.createElement("img");

            img.src = event.target.result;

            preview.appendChild(img);
        };

        reader.readAsDataURL(file);
    });
});


/* STEP NAVIGATION */
function nextStep(number) {

    document.querySelectorAll(".step")
        .forEach(step => step.classList.remove("active"));

    document.getElementById("step" + number)
        .classList.add("active");

    for (let i = 1; i <= 4; i++) {

        const progress =
            document.getElementById("p" + i);

        if (i <= number) {
            progress.classList.add("active");
        } else {
            progress.classList.remove("active");
        }
    }

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* VALIDATE AND SHOW PREVIEW */
function preparePreview() {

    const title =
        document.getElementById("title").value.trim();

    const category =
        document.getElementById("category").value;

    const condition =
        document.getElementById("condition").value;

    const price =
        document.getElementById("price").value;

    const description =
        document.getElementById("description").value.trim();

    const state =
        document.getElementById("state").value.trim();

    const city =
        document.getElementById("city").value.trim();

    const whatsapp =
        document.getElementById("whatsapp").value.trim();

    if (!title ||
        !category ||
        !condition ||
        !price ||
        !description ||
        !state ||
        !city ||
        !whatsapp) {

        alert("Please fill in all required fields.");
        return;
    }

    const brand =
        document.getElementById("brand").value.trim();

    const model =
        document.getElementById("model").value.trim();

    const area =
        document.getElementById("area").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const instagram =
        document.getElementById("instagram").value.trim();

    const telegram =
        document.getElementById("telegram").value.trim();

    const tiktok =
        document.getElementById("tiktok").value.trim();

    document.getElementById("summary").innerHTML = `

        <strong>Title:</strong> ${escapeHtml(title)}<br>

        <strong>Category:</strong> ${escapeHtml(category)}<br>

        <strong>Condition:</strong> ${escapeHtml(condition)}<br>

        <strong>Brand:</strong> ${escapeHtml(brand || "Not specified")}<br>

        <strong>Model:</strong> ${escapeHtml(model || "Not specified")}<br>

        <strong>Price:</strong> ₦${Number(price).toLocaleString()}<br>

        <strong>Description:</strong><br>
        ${escapeHtml(description)}<br><br>

        <strong>Location:</strong>
        ${escapeHtml(area ? area + ", " : "")}
        ${escapeHtml(city)}, ${escapeHtml(state)}<br>

        <strong>WhatsApp:</strong> ${escapeHtml(whatsapp)}<br>

        <strong>Phone:</strong> ${escapeHtml(phone || "Not specified")}<br>

        <strong>Instagram:</strong> ${escapeHtml(instagram || "Not specified")}<br>

        <strong>Telegram:</strong> ${escapeHtml(telegram || "Not specified")}<br>

        <strong>TikTok:</strong> ${escapeHtml(tiktok || "Not specified")}<br>

        <strong>Photos:</strong> ${selectedPhotos.length}
    `;

    nextStep(4);
}


/* SAVE LISTING */
async function saveListing() {

    const button =
        document.getElementById("saveButton");

    const errorBox =
        document.getElementById("errorBox");

    errorBox.style.display = "none";

    if (!currentUser) {

        window.location.href = "login.html";
        return;
    }

    button.disabled = true;
    button.textContent = "Saving...";

    const title =
        document.getElementById("title").value.trim();

    const description =
        document.getElementById("description").value.trim();

    const price =
        Number(document.getElementById("price").value);

    const condition =
        document.getElementById("condition").value;

    const brand =
        document.getElementById("brand").value.trim();

    const model =
        document.getElementById("model").value.trim();

    const state =
        document.getElementById("state").value.trim();

    const city =
        document.getElementById("city").value.trim();

    const area =
        document.getElementById("area").value.trim();

    const whatsapp =
        document.getElementById("whatsapp").value.trim();

    const instagram =
        document.getElementById("instagram").value.trim();

    const telegram =
        document.getElementById("telegram").value.trim();

    const tiktok =
        document.getElementById("tiktok").value.trim();

    const phone =
        document.getElementById("phone").value.trim();


    /*
       IMPORTANT:
       Your database allows:
       pending
       active
       sold
       expired
       rejected
       deleted

       Therefore the new listing uses:
       status: "pending"
    */

    const listingData = {

        seller_id: currentUser.id,

        title: title,

        description: description,

        price: price,

        condition: condition,

        brand: brand || null,

        model: model || null,

        state: state,

        city: city,

        area: area,

        whatsapp: whatsapp,

        instagram: instagram || null,

        telegram: telegram || null,

        tiktok: tiktok || null,

        phone: phone || null,

        status: "pending",

        payment_status: "pending",

        listing_fee: 1000,

        views: 0,

        favorites_count: 0,

        image_urls: []

    };


    const { data, error } =
        await supabaseClient
            .from("listings")
            .insert(listingData)
            .select()
            .single();


    if (error) {

        console.error(error);

        errorBox.textContent =
            "Could not save your listing: " +
            error.message;

        errorBox.style.display = "block";

        button.disabled = false;

        button.textContent =
            "Continue to Payment →";

        return;
    }


    console.log("Listing created:", data);

    document.querySelectorAll(".step")
        .forEach(step =>
            step.classList.remove("active")
        );

    document.querySelector(".progress")
        .style.display = "none";

    document.querySelector("h1")
        .style.display = "none";

    document.querySelector(".subtitle")
        .style.display = "none";

    document.getElementById("successBox")
        .style.display = "block";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* HTML ESCAPE */
function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* START */
checkLogin();

</script>

</body>
</html>
