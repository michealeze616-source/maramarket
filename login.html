<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MaraMarket</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0d6efd, #4f8cff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 24px;
            padding: 30px 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            color: #0d6efd;
            margin-bottom: 6px;
        }

        .tagline {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 22px;
            font-size: 25px;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13,110,253,0.1);
        }

        .login-btn {
            width: 100%;
            border: none;
            padding: 15px;
            margin-top: 22px;
            border-radius: 12px;
            background: #0d6efd;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-btn:disabled {
            opacity: 0.6;
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: 12px;
            color: #0d6efd;
            text-decoration: none;
            font-size: 14px;
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
        }

        .message.error {
            display: block;
            background: #ffe8e8;
            color: #c62828;
        }

        .message.success {
            display: block;
            background: #e7f8ed;
            color: #188038;
        }

        .signup {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .signup a {
            color: #0d6efd;
            font-weight: 700;
            text-decoration: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #777;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">MaraMarket</div>
    <div class="tagline">Buy. Sell. Connect.</div>

    <h1>Welcome Back</h1>

    <div id="loginForm">

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
        >

        <button type="button" class="login-btn" id="loginButton">
            Log In
        </button>

        <a href="#" class="forgot" id="forgotPassword">
            Forgot password?
        </a>

        <div id="message" class="message"></div>

    </div>

    <div class="signup">
        Don't have an account?
        <a href="signup.html">Create Account</a>
    </div>

    <a href="index.html" class="back">← Back to MaraMarket</a>

</div>

<script>
    const SUPABASE_URL =
        "https://hakjsjmexinuiwhxejva.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_OjO3jp9ZlV0N2WHHBddN8g_rryvMoAL";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

    const loginButton =
        document.getElementById("loginButton");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const message =
        document.getElementById("message");

    const forgotPassword =
        document.getElementById("forgotPassword");


    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
    }


    loginButton.addEventListener("click", async function () {

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        message.className = "message";
        message.textContent = "";

        if (!email || !password) {
            showMessage(
                "Please enter your email and password.",
                "error"
            );
            return;
        }

        loginButton.disabled = true;
        loginButton.textContent = "Logging in...";

        try {

            const result =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

            const data = result.data;
            const error = result.error;

            if (error) {

                console.error("LOGIN ERROR:", error);

                showMessage(
                    error.message,
                    "error"
                );

                loginButton.disabled = false;
                loginButton.textContent = "Log In";
                return;
            }

            if (!data || !data.user) {

                showMessage(
                    "Login failed. Please try again.",
                    "error"
                );

                loginButton.disabled = false;
                loginButton.textContent = "Log In";
                return;
            }

            showMessage(
                "Login successful! Opening MaraMarket...",
                "success"
            );

            setTimeout(function () {
                window.location.href = "index.html";
            }, 700);

        } catch (err) {

            console.error(
                "LOGIN EXCEPTION:",
                err
            );

            showMessage(
                "Something went wrong. Please try again.",
                "error"
            );

            loginButton.disabled = false;
            loginButton.textContent = "Log In";
        }
    });


    forgotPassword.addEventListener(
        "click",
        async function (event) {

            event.preventDefault();

            const email =
                emailInput.value.trim();

            if (!email) {

                showMessage(
                    "Enter your email address first.",
                    "error"
                );

                return;
            }

            try {

                const { error } =
                    await supabaseClient.auth
                    .resetPasswordForEmail(
                        email,
                        {
                            redirectTo:
                            "https://michealeze616-source.github.io/maramarket/login.html"
                        }
                    );

                if (error) {

                    showMessage(
                        error.message,
                        "error"
                    );

                    return;
                }

                showMessage(
                    "Password reset instructions have been sent to your email.",
                    "success"
                );

            } catch (err) {

                console.error(err);

                showMessage(
                    "Unable to send password reset email.",
                    "error"
                );
            }
        }
    );
</script>

</body>
</html>
