<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - MaraMarket</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0d6efd, #4f46e5, #7c3aed);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      color: #172033;
    }

    .container {
      width: 100%;
      max-width: 560px;
      background: rgba(255,255,255,0.96);
      border-radius: 28px;
      padding: 32px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.2);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      color: #1769ff;
      font-size: 32px;
      margin-bottom: 6px;
    }

    .logo p {
      color: #667085;
      font-size: 14px;
    }

    h2 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #667085;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .section-title {
      font-size: 15px;
      font-weight: bold;
      margin: 22px 0 12px;
      color: #1769ff;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #d8dee9;
      border-radius: 13px;
      outline: none;
      font-size: 15px;
      background: #fff;
    }

    input:focus,
    select:focus {
      border-color: #1769ff;
      box-shadow: 0 0 0 3px rgba(23,105,255,0.1);
    }

    .required {
      color: #e11d48;
    }

    .optional {
      color: #98a2b3;
      font-weight: normal;
    }

    .hint {
      font-size: 12px;
      color: #667085;
      margin-top: 5px;
    }

    .button {
      width: 100%;
      border: none;
      padding: 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1769ff, #4f46e5);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 12px;
      margin-bottom: 18px;
      font-size: 14px;
    }

    .error {
      display: block;
      background: #fff1f2;
      color: #be123c;
      border: 1px solid #fecdd3;
    }

    .success {
      display: block;
      background: #ecfdf3;
      color: #027a48;
      border: 1px solid #abefc6;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #667085;
    }

    .login a {
      color: #1769ff;
      font-weight: bold;
      text-decoration: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #667085;
      text-decoration: none;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 24px 18px;
        border-radius: 22px;
      }

      .row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .logo h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <h1>MaraMarket</h1>
    <p>Buy. Sell. Connect.</p>
  </div>

  <h2>Create your account</h2>
  <p class="subtitle">
    Join MaraMarket and start buying or selling today.
  </p>

  <div id="message" class="message"></div>

  <form id="signupForm">

    <div class="section-title">Personal Information</div>

    <div class="row">
      <div class="field">
        <label>Full Name <span class="required">*</span></label>
        <input
          type="text"
          id="fullName"
          placeholder="Your full name"
          required
        >
      </div>

      <div class="field">
        <label>Username <span class="required">*</span></label>
        <input
          type="text"
          id="username"
          placeholder="e.g. mike123"
          required
          minlength="3"
          maxlength="30"
        >
        <div class="hint">Letters, numbers and underscores only.</div>
      </div>
    </div>

    <div class="field">
      <label>Email <span class="required">*</span></label>
      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        required
      >
    </div>

    <div class="row">
      <div class="field">
        <label>Phone <span class="optional">(optional)</span></label>
        <input
          type="tel"
          id="phone"
          placeholder="08012345678"
        >
      </div>

      <div class="field">
        <label>WhatsApp <span class="required">*</span></label>
        <input
          type="tel"
          id="whatsapp"
          placeholder="08012345678"
          required
        >
      </div>
    </div>

    <div class="section-title">Location</div>

    <div class="row">
      <div class="field">
        <label>State <span class="required">*</span></label>
        <input
          type="text"
          id="state"
          placeholder="e.g. Lagos"
          required
        >
      </div>

      <div class="field">
        <label>City <span class="required">*</span></label>
        <input
          type="text"
          id="city"
          placeholder="e.g. Ikeja"
          required
        >
      </div>
    </div>

    <div class="field">
      <label>Area <span class="optional">(optional)</span></label>
      <input
        type="text"
        id="area"
        placeholder="e.g. Allen Avenue"
      >
    </div>

    <div class="section-title">Social Media <span class="optional">(optional)</span></div>

    <div class="row">
      <div class="field">
        <label>Instagram</label>
        <input
          type="text"
          id="instagram"
          placeholder="@username"
        >
      </div>

      <div class="field">
        <label>Telegram</label>
        <input
          type="text"
          id="telegram"
          placeholder="@username"
        >
      </div>
    </div>

    <div class="field">
      <label>TikTok</label>
      <input
        type="text"
        id="tiktok"
        placeholder="@username"
      >
    </div>

    <div class="section-title">Security</div>

    <div class="field">
      <label>Password <span class="required">*</span></label>
      <input
        type="password"
        id="password"
        placeholder="At least 6 characters"
        minlength="6"
        required
      >
    </div>

    <div class="field">
      <label>Confirm Password <span class="required">*</span></label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Enter your password again"
        minlength="6"
        required
      >
    </div>

    <button type="submit" class="button" id="signupButton">
      Create Account
    </button>

  </form>

  <div class="login">
    Already have an account?
    <a href="login.html">Log in</a>
  </div>

  <a href="index.html" class="back">← Back to MaraMarket</a>

</div>

<script>
  const SUPABASE_URL = "https://hakjsjmexinuiwhxejva.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_OjO3jp9ZlV0N2WHHBddN8g_rryvMoAL";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const form = document.getElementById("signupForm");
  const button = document.getElementById("signupButton");
  const message = document.getElementById("message");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
  }

  function cleanUsername(username) {
    return username
      .trim()
      .toLowerCase()
      .replace(/[^a-z0-9_]/g, "");
  }

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    message.className = "message";
    message.textContent = "";

    const fullName = document.getElementById("fullName").value.trim();
    const username = cleanUsername(
      document.getElementById("username").value
    );
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const whatsapp = document.getElementById("whatsapp").value.trim();
    const state = document.getElementById("state").value.trim();
    const city = document.getElementById("city").value.trim();
    const area = document.getElementById("area").value.trim();
    const instagram = document.getElementById("instagram").value.trim();
    const telegram = document.getElementById("telegram").value.trim();
    const tiktok = document.getElementById("tiktok").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword =
      document.getElementById("confirmPassword").value;

    if (username.length < 3) {
      showMessage(
        "Username must contain at least 3 valid characters.",
        "error"
      );
      return;
    }

    if (password.length < 6) {
      showMessage(
        "Password must contain at least 6 characters.",
        "error"
      );
      return;
    }

    if (password !== confirmPassword) {
      showMessage(
        "Passwords do not match.",
        "error"
      );
      return;
    }

    button.disabled = true;
    button.textContent = "Creating account...";

    try {

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,

        options: {
          data: {
            full_name: fullName,
            username: username,
            phone: phone,
            whatsapp: whatsapp,
            state: state,
            city: city,
            area: area,
            instagram: instagram,
            telegram: telegram,
            tiktok: tiktok
          }
        }
      });

      if (error) {
        throw error;
      }

      if (data.session) {

        showMessage(
          "Account created successfully! Redirecting...",
          "success"
        );

        setTimeout(() => {
          window.location.href = "index.html";
        }, 1200);

      } else {

        showMessage(
          "Account created! Please check your email to confirm your account, then log in.",
          "success"
        );

        form.reset();
      }

    } catch (error) {

      console.error(error);

      showMessage(
        error.message || "Something went wrong while creating your account.",
        "error"
      );

    } finally {

      button.disabled = false;
      button.textContent = "Create Account";
    }
  });
</script>

</body>
</html>
