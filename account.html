<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Account - MaraMarket</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background:
        linear-gradient(135deg, #eef5ff, #f8fbff);
    min-height: 100vh;
    color: #172033;
}

header {
    height: 70px;
    background: rgba(255,255,255,.95);
    border-bottom: 1px solid #e5eaf2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    color: #1769ff;
    font-size: 24px;
    font-weight: 800;
    text-decoration: none;
}

.home-link {
    color: #1769ff;
    text-decoration: none;
    font-weight: 600;
}

.container {
    width: 100%;
    max-width: 850px;
    margin: auto;
    padding: 35px 18px 60px;
}

.profile-card {
    background: rgba(255,255,255,.96);
    border-radius: 24px;
    padding: 30px;
    box-shadow: 0 15px 45px rgba(30,70,130,.10);
}

.profile-top {
    text-align: center;
    margin-bottom: 30px;
}

.avatar {
    width: 85px;
    height: 85px;
    border-radius: 50%;
    background: linear-gradient(135deg,#1769ff,#4d91ff);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 15px;
    font-size: 34px;
    font-weight: 800;
}

h1 {
    font-size: 28px;
    margin-bottom: 7px;
}

.email {
    color: #6b7280;
    word-break: break-word;
}

.section {
    margin-top: 28px;
}

.section-title {
    font-size: 17px;
    font-weight: 750;
    margin-bottom: 12px;
}

.input {
    width: 100%;
    padding: 14px;
    border: 1px solid #dce3ee;
    border-radius: 11px;
    font-size: 15px;
    outline: none;
}

.input:focus {
    border-color: #1769ff;
    box-shadow: 0 0 0 3px rgba(23,105,255,.10);
}

.save-btn,
.logout-btn,
.listings-btn,
.sell-btn {
    width: 100%;
    border: none;
    border-radius: 11px;
    padding: 14px;
    font-size: 15px;
    font-weight: 750;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    display: block;
}

.save-btn {
    background: #1769ff;
    color: white;
    margin-top: 12px;
}

.listings-btn {
    background: #1769ff;
    color: white;
}

.sell-btn {
    background: #eef4ff;
    color: #1769ff;
    margin-top: 10px;
}

.logout-btn {
    background: #fff0f0;
    color: #c62828;
    margin-top: 10px;
}

.message {
    display: none;
    padding: 12px;
    border-radius: 10px;
    margin-top: 12px;
    font-size: 14px;
}

.success {
    background: #e5f8ec;
    color: #147a36;
}

.error {
    background: #ffe9e9;
    color: #b42318;
}

.loading {
    text-align: center;
    padding: 60px 20px;
    color: #667085;
}

@media (max-width: 600px) {

    header {
        padding: 0 16px;
    }

    .logo {
        font-size: 21px;
    }

    .container {
        padding: 22px 14px 45px;
    }

    .profile-card {
        padding: 22px 18px;
        border-radius: 20px;
    }

    h1 {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<header>

    <a href="index.html" class="logo">
        MaraMarket
    </a>

    <a href="index.html" class="home-link">
        ← Home
    </a>

</header>


<div class="container">

    <div id="loading" class="loading">
        Loading your account...
    </div>


    <div id="accountCard"
         class="profile-card"
         style="display:none;">

        <div class="profile-top">

            <div id="avatar"
                 class="avatar">
                M
            </div>

            <h1 id="welcomeName">
                MaraMarket User
            </h1>

            <div id="email"
                 class="email">
                Loading...
            </div>

        </div>


        <!-- MY LISTINGS -->

        <div class="section">

            <div class="section-title">
                Selling
            </div>

            <a href="my-listings.html"
               class="listings-btn">

                📦 My Listings

            </a>

            <a href="sell.html"
               class="sell-btn">

                + Sell Something

            </a>

        </div>


        <!-- PROFILE -->

        <div class="section">

            <div class="section-title">
                Profile Information
            </div>

            <input
                id="displayName"
                class="input"
                type="text"
                placeholder="Your name"
            >

            <button
                id="saveBtn"
                class="save-btn"
                onclick="saveProfile()">

                Save Changes

            </button>

            <div
                id="message"
                class="message">
            </div>

        </div>


        <!-- ACCOUNT -->

        <div class="section">

            <div class="section-title">
                Account
            </div>

            <button
                class="logout-btn"
                onclick="logoutUser()">

                Log Out

            </button>

        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://hakjsjmexinuiwhxejva.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_OjO3jp9ZlV0N2WHHBddN8g_rryvMoAL";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


let currentUser = null;


function getUserName(user) {

    return (
        user.user_metadata?.full_name ||
        user.user_metadata?.name ||
        user.user_metadata?.username ||
        "MaraMarket User"
    );
}


function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display = "block";

}


async function loadAccount() {

    const {
        data,
        error
    } = await supabaseClient.auth.getSession();


    if (error) {

        console.error(error);

        window.location.href =
            "login.html";

        return;
    }


    const session = data.session;


    if (!session) {

        window.location.href =
            "login.html";

        return;
    }


    currentUser = session.user;


    const name =
        getUserName(currentUser);


    document.getElementById(
        "welcomeName"
    ).textContent = name;


    document.getElementById(
        "email"
    ).textContent =
        currentUser.email || "";


    document.getElementById(
        "displayName"
    ).value = name === "MaraMarket User"
        ? ""
        : name;


    const firstLetter =
        name.charAt(0).toUpperCase();


    document.getElementById(
        "avatar"
    ).textContent =
        firstLetter || "M";


    document.getElementById(
        "loading"
    ).style.display = "none";


    document.getElementById(
        "accountCard"
    ).style.display = "block";

}


async function saveProfile() {

    if (!currentUser) {
        return;
    }


    const input =
        document.getElementById(
            "displayName"
        );


    const newName =
        input.value.trim();


    if (!newName) {

        showMessage(
            "Please enter your name.",
            "error"
        );

        return;
    }


    const saveBtn =
        document.getElementById(
            "saveBtn"
        );


    saveBtn.disabled = true;

    saveBtn.textContent =
        "Saving...";


    const {
        error
    } = await supabaseClient.auth.updateUser({

        data: {
            full_name: newName
        }

    });


    saveBtn.disabled = false;

    saveBtn.textContent =
        "Save Changes";


    if (error) {

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

        return;
    }


    document.getElementById(
        "welcomeName"
    ).textContent =
        newName;


    document.getElementById(
        "avatar"
    ).textContent =
        newName
            .charAt(0)
            .toUpperCase();


    showMessage(
        "Profile updated successfully.",
        "success"
    );

}


async function logoutUser() {

    const {
        error
    } = await supabaseClient.auth.signOut();


    if (error) {

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

        return;
    }


    window.location.href =
        "index.html";

}


supabaseClient.auth.onAuthStateChange(
    (event, session) => {

        if (
            event === "SIGNED_OUT" ||
            !session
        ) {

            window.location.href =
                "login.html";

        }

    }
);


loadAccount();

</script>

</body>
</html>
